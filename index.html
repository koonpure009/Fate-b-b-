const hurt=(b,p)=>{if(dk=='artoria'&&L&&B.k.rel&&e.dark){ad('ดาบศักดิ์สิทธิ์ขับไล่เงา ไม่ได้รับดาเมจ','v');return 0}let d=Math.max(1,Math.round(b*M(B.boss&&!(B.el>0)?0:e.cls,L?G.sv:0))+r(-2,3)-(p?0:Math.round(s.df*(LS?1.5:.5))));if(B.g&&!p)d=Math.max(1,Math.round(d*(LS?.35:.7)));const hb=G.hp;G.hp=Math.max(0,G.hp-d);if(G.hp<=0&&dk=='nero'&&L&&hb<=s.hp*.2&&G.mp>=2){const rr=Math.max(0,3-(B.link-1));G.hp=Math.min(s.hp,Math.floor(G.mp/2));G.mp=0;B.link=0;B.k={};B.cd=rr?rr+1:0;ad('อภิสิทธิ์ของจักรพรรดิถูกบังคับใช้! แปลง MP เป็น HP แต่ Link ถูกยกเลิก','v')}return d};
const hitE=b=>roll(eChance(b));
if(a=='grd'){B.eg=true;if(B.boss)e.mp=Math.min(100,e.mp+10);ad('ตั้งรับ','g')}
else if(a=='atk'||a=='hv'){const Lk=B.el>0,m=a=='hv'?1.6:(B.boss?(Lk?1.5:.8):1);if(B.boss)e.mp=Math.min(100,e.mp+8);if(hitE(85))ad(`โดน ${hurt(e.atk*m)} ดาเมจ`,'b');else ad('พลาด! คุณหลบการโจมตีได้','g')}
else if(a=='pot'){e.pot--;const h=50+e.k*15;e.hp=Math.min(e.max,e.hp+h);ad(`ฟื้น ${h} HP`,'g')}
else if(a=='link'){e.mp-=30;B.el=6;B.eu=true;B.enp=0;ad('ผสานกับเซอร์แวนต์ พลังพุ่งสูงขึ้น!','v')}
else if(a=='np'){e.mp-=50;B.enp++;ad(`โดน ${hurt(e.atk*3.4,1)} ดาเมจ!`,'v')}
else if(a[0]=='s'){const kk=q.sk[a[2]],n=kk.h||1;e.mp-=kk.c;let t=0,ln=0;for(let i=0;i<n;i++){if(hitE(90)){ln++;t+=hurt(e.atk*kk.m,kk.p)}}if(kk.e)e.hp=Math.min(e.max,e.hp+kk.e);ad((ln?`โดน ${n>1?ln+'/'+n+' ครั้ง รวม ':''}${t} ดาเมจ`:'พลาด! คุณหลบได้')+(kk.e?` ฟื้น ${kk.e} HP`:''),'b')}
if(B.boss){if(B.el>0){B.el--;if(!B.el){ad(e.n+' หมดสถานะ Link','v');B.ecd=3}}else if(B.ecd>0)B.ecd--}
}
function endRound(){G.mp=Math.max(0,G.mp);const k=B.k;if(k.rg>0&&G.hp>0){const h=Math.round(st().hp*.1);G.hp=Math.min(st().hp,G.hp+h);ad(`Avalon ฟื้น HP ${h}`,'g')}if(k.rg>0)k.rg--;['buff','n2','np','ab','cool'].forEach(x=>{if(k[x]>0)k[x]--});if(B.carry>0){B.carry--;if(!B.carry)B.k={}}
if(B.link>0){B.link--;if(!B.link){ad('Link ของคุณสิ้นสุดลง ต้องรอ 3 เทิร์นก่อน Link ได้อีก','v');B.cd=3;B.k={}}}else if(B.cd>0)B.cd--;if(G.hp>0)G.hp=Math.min(G.hp,st().hp);
if(G.hp<=0){B.over=true;G.pend=1;G.gold=Math.floor(G.gold/2);sv();ad(((G.dif||0)>0&&G.dd>=1)?'คุณล้มลงเป็นครั้งที่สอง... จบเกม':'คุณล้มลง... สูญเสียเงินครึ่งหนึ่ง','b')}
B.busy=false;sv();dr()}
function win(){const e=B.e;B.over=true;B.busy=false;B.k={};B.sl=0;B.spm=0;B.rnd=0;B.carry=0;B.stun=0;const em=(B.link>0&&(!B.boss||B.el>0))?EM(e.cls):1,x=Math.round(e.exp*em);G.exp+=x;G.gold+=e.gold;ad(`ชนะ! ได้ EXP ${x}${em!=1?` (x${em} จากคลาส)`:''} เงิน ${e.gold}`,'v');
if(B.boss&&!B.amb){G.def.push(B.boss);G.c=1;G.up.str++;G.up.vit++;G.up.agi++;G.inv.hs++;G.inv.ms++;ad(`โค่น ${e.n} ได้แล้ว! ได้พลังถาวร (STR+1 VIT+1 AGI+1) ยา HP เล็ก x1 ยา MP เล็ก x1`,'v')}
else if(r(0,7)==0){ad('ศัตรูทิ้ง'+drop(),'g')}
const m=lvl();if(m)ad(m,'v');if((G.dif||0)<0){const s=st();G.hp=s.hp;G.mp=s.mp;ad('โหมดง่าย: ฟื้น HP/MP เต็ม','g')}sv();dr()}
function aft(){if(B.boss&&!B.amb){G.def.length>=6?end():choose('โค่นบอสแล้ว เริ่มเส้นทางรอบใหม่')}else nx()}
function dead(){B=null;G.pend=0;G.ro=null;const d=G.dif||0;if(d>0&&G.dd>=1)return over();if(d>0)G.dd=(G.dd||0)+1;const s=st();if(d<0){G.hp=s.hp;G.mp=s.mp}else{G.hp=Math.max(1,Math.round(s.hp*.1));G.mp=Math.max(1,Math.round(s.mp*.1))}G.c=1;G.safe=1;let g='';if(d==0&&G.inv.hs+G.inv.hm+G.inv.hl==0){G.inv.hs++;g=' และได้ยา HP เล็กปลอบใจ 1 ขวด'}choose('คุณฟื้นขึ้นมา'+(d<0?'':' ด้วย HP/MP เหลือ 10%')+g+' ขั้นแรกหลังฟื้นไม่มีศัตรู (บอสที่โค่นแล้วยังนับอยู่)')}

const KT={

charl:{s:[['ดาบทั้ง 12 ของเหล่าอัศวิน',50,'ใช้ DEF แทน ATK จนจบ Link'],['ตัวเราแบบ cool!',60,'สำเร็จ 80% · ศัตรู DEF -5 เรา DEF +5 2 เทิร์น']],np:['Joyeuse Ordre',150,'DEF x2 · ลงมือก่อน 60% · ต้องใช้ดาบ 12 เล่มก่อน']}};
function kOk(a){const d=D(),id=d.kit,k=B.k||{},t=KT[id],c=a=='np'?t.np[1]:t.s[+a[1]][1],s=st();
if(B.link<=0)return false;if(!(id=='charl'?G.mp+(s.spd-1)*10>=c:G.mp>=c))return false;
if(a=='np'){if(B.npu)return false;if(id=='artoria')return !!k.rel;if(id=='nero')return B.link==1;if(id=='yamato')return (k.fr||0)>=2;return !!k.sw}
if(id=='artoria'&&a=='k0')return !k.rel;if(id=='nero'&&a=='k0')return G.mp>=2;

if(id=='charl'&&a=='k0')return !k.sw;return true}

function kitAct(a,s,cr){const id=D().kit,k=B.k,sp=c=>{if(id!='charl'||G.mp>=c)G.mp-=c;else{const n=Math.ceil((c-G.mp)/10);B.sl=(B.sl||0)+n;G.mp=0;ad(`MP ไม่พอ เสียความเร็ว ${n} หน่วย`,'g')}};
if(id=='artoria'){
 if(a=='k0'){sp(100);k.rel=1;k.buff=4;ad('ปลดปล่อยดาบศักดิ์สิทธิ์! Excalibur เผยรูปร่างที่แท้จริง ATK +30%','v')}
 else if(a=='k1'){sp(60);k.rg=3;ad('ฝักดาบ Avalon คุ้มครอง ฟื้น 10% HP ทุกเทิร์น 3 เทิร์น','g')}
 else{sp(90);B.npu=1;if(tryHit(90)){const x=hit(cr(Math.round(s.atk*2.5))+r(0,6),1);ad(`Excalibur โดน ${x} ดาเมจ!`,'v')}else ad('Excalibur พลาด! แสงดาบพุ่งผ่านเป้าหมายไป','b')}}

 if(a=='k0'){const m0=G.mp,h=Math.floor(m0/2);G.hp=Math.min(s.hp,G.hp+h);G.mp=0;ad(`อภิสิทธิ์ของจักรพรรดิ แปลง MP ${m0} เป็น HP ${h}`,'g')}
 else if(a=='k1'){sp(150);k.n2=4;ad('ดาบเพลิงจักรพรรดิ! สเตตัสอย่างละ 2 ถูกแปลงเป็นพลังโจมตี 3 เทิร์น','v')}
 else{sp(100);B.npu=1;k.nb=1;const s2=st(),x=hit(cr(Math.round(s2.atk*2.5))+r(0,6),1);B.k={nb:1};B.link=0;B.cd=4;B.carry=2;ad(`Laus Saint Claudius ${x} ดาเมจ! พลัง Link ถูกโอนไปยังร่างปกติ 1 เทิร์น`,'v')}}

 if(a=='k0'){sp(50);k.fr=(k.fr||0)+1;ad(`เศษเสี้ยวสายฟ้า ครั้งที่ ${k.fr}/2`+(k.fr>=2?' ปาฏิหาริย์เกิดขึ้น!':''),'v')}

 else{k.fin=1;if(!tryHit(70)){ad('ดาบเทพสายฟ้าตัดพิภพ พลาด! Link ยังอยู่ แต่ใช้ได้เพียง 1 ครั้งต่อ Link','b');return}delete k.fin;const x=hit(cr(Math.round(s.atk*2+s.spd*2))+r(0,6),1),lim=Math.round(s.hp*.15);if(G.hp>lim)G.hp=lim;B.link=0;B.cd=4;B.k={};
  if(a=='k1'){B.stun=2;ad(`ดาบเทพสายฟ้าตัดพิภพ ${x} ดาเมจ! HP เหลือ 15% Link สิ้นสุด และขยับไม่ได้ 2 เทิร์น`,'v')}else{B.spm=.5;ad(`ดาบเทพสายฟ้าตัดพิภพ ${x} ดาเมจ! ยอมเสียความเร็ว 50% แลกกับไม่หยุดนิ่ง HP เหลือ 15% Link สิ้นสุด`,'v')}}}
else{
 if(a=='k0'){sp(50);k.sw=1;ad('ดาบทั้ง 12 ของเหล่าอัศวิน! ใช้พลังป้องกันแทนพลังโจมตี','v')}

 else{sp(150);B.npu=1;k.cn=1;const s2=st(),x=hit(cr(Math.round(s2.df*2))+r(0,6),1);ad(`Joyeuse Ordre ${x} ดาเมจ!`,'v')}}}

${d.kit?kBtn('np',ds):`<button class="p" ${ds||!L||B.npu||G.mp<50?'disabled':''} onclick="play('np')">${d.np}<small>${B.npu?'ใช้แล้วในรอบ Link นี้':'โฮกุ · '+(L?'':'ใช้ได้ตอน Link · ')+'1 ครั้งต่อ Link · 50 MP'}</small></button>`}`+
(d.kit?KT[d.kit].s.map((_,i)=>kBtn('k'+i,ds)).join(''):d.sk.map((k,i)=>`<button ${ds||!L||G.mp<k.c?'disabled':''} onclick="play('s${i}')">${k.n}<small>${L?'':'ใช้ได้ตอน Link · '}${k.c} MP</small></button>`).join(''))+
`<button class="full" ${ds?'disabled':''} onclick="tog()">ไอเทม ${B.menu?'▲':'▼'}</button></div>`+(B.menu?`<div class="a">${itemBtns('iplay')}</div>`:'')}
